services:
  tupoproxy:
    image: tupoproxy:local
    build:
      context: .
      target: prod
    container_name: tupoproxy
    restart: unless-stopped
    ports:
      - "443:443"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9091:9091"
    # Working dir uses tmpfs for runtime caches. The repository example config
    # is read-only; use a host directory mount if API config mutation is needed.
    working_dir: /run/tupoproxy
    command: ["/app/config.toml"]
    volumes:
      - ./config.toml:/app/config.toml:ro
    tmpfs:
      - /run/tupoproxy:rw,mode=1777,size=4m
    environment:
      - RUST_LOG=info
    healthcheck:
      test: [ "CMD", "/app/tupoproxy", "healthcheck", "/app/config.toml", "--mode", "liveness" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 262144
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
