name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  caddy-image:
    name: Publish managed Caddy image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/caddy-l4.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/wasteprince/tupoproxy-caddy-l4:${{ github.ref_name }}
            ghcr.io/wasteprince/tupoproxy-caddy-l4:managed

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build static binary
        run: cross build --release --locked --target "${{ matrix.target }}" --bin tupoproxy
      - name: Verify and package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/${TARGET}/release/tupoproxy"
          file "$binary"
          if readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
            echo "The release binary is dynamically linked" >&2
            exit 1
          fi
          if [ "$TARGET" = "x86_64-unknown-linux-musl" ]; then
            "$binary" --version
          fi
          package="tupoproxy-${TARGET}"
          mkdir -p "dist/${package}"
          install -m 0755 "$binary" "dist/${package}/tupoproxy"
          install -m 0644 LICENSE README.md "dist/${package}/"
          tar -C "dist/${package}" -czf "dist/${package}.tar.gz" .
      - uses: actions/upload-artifact@v7
        with:
          name: tupoproxy-${{ matrix.target }}
          path: dist/tupoproxy-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, caddy-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: tupoproxy-*
          path: dist
          merge-multiple: true
      - name: Add one-command management scripts
        run: |
          install -m 0755 install.sh dist/install.sh
          install -m 0755 uninstall.sh dist/uninstall.sh
          install -m 0755 edge-integration.py dist/edge-integration.py
          install -m 0755 fake-tls-probe.py dist/fake-tls-probe.py
          install -m 0644 install-runtime.sh dist/install-runtime.sh
      - name: Generate checksums
        working-directory: dist
        run: sha256sum tupoproxy-*.tar.gz install.sh install-runtime.sh uninstall.sh edge-integration.py fake-tls-probe.py | sort -k2 > CHECKSUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "tupoproxy ${GITHUB_REF_NAME}" \
            --generate-notes \
            --latest
