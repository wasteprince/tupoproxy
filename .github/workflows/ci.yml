name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check installer scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck -x install.sh install-source.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Test TLS profile selection
        run: cargo test --locked fingerprint
      - name: Test adaptive TLS record profiles
        run: cargo test --locked selected_record_profiles_have_distinct_bounded_phases
