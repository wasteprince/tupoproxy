name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check installer scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck -x install.sh install-source.sh uninstall.sh
          bash install.sh --help | grep -F -- '--tls-domain-port PORT'
          bash install.sh --help | grep -F -- '--tls-cert-fullchain PATH'
          bash uninstall.sh --help | grep -F -- '--purge-certificate'
          test_dir="$(mktemp -d)"
          set +e
          output="$(sudo env CONFIG_DIR="${test_dir}/not-installed" bash install.sh \
            --domain invalid --email admin@example.com 2>&1)"
          status=$?
          set -e
          rm -rf -- "$test_dir"
          test "$status" -eq 1
          grep -F 'invalid domain: invalid' <<<"$output"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Test TLS profile selection
        run: cargo test --locked fingerprint
      - name: Test adaptive TLS record profiles
        run: cargo test --locked selected_record_profiles_have_distinct_bounded_phases
