name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check installer scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck -x install.sh install-runtime.sh install-source.sh uninstall.sh
          python3 -c 'import ast, pathlib; [ast.parse(pathlib.Path(path).read_text()) for path in ("edge-integration.py", "fake-tls-probe.py")]'
          python3 -c 'import pathlib, tomllib; tomllib.loads(pathlib.Path("deploy/tupoproxy.toml.example").read_text())'
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_*.py'
          installer_help="$(bash install.sh --help)"
          grep -F -- '--tls-domain NAME' <<<"$installer_help"
          ! grep -F -- '--tls-domain-port PORT' <<<"$installer_help"
          ! grep -F -- '--port PORT' <<<"$installer_help"
          ! grep -F -- '--email ADDRESS' <<<"$installer_help"
          grep -F 'mask = false' install-runtime.sh
          grep -F 'unknown_sni_action = "drop"' install-runtime.sh
          grep -F 'tls_front_dir = "${STATE_DIR}/tlsfront-hmac-only"' install-runtime.sh
          source install-runtime.sh
          PUBLIC_HOST=site.example.com
          PUBLIC_PORT=443
          SECRET=00112233445566778899aabbccddeeff
          TLS_DOMAIN=proxy.example.com
          test "$(telegram_proxy_link)" = 'tg://proxy?server=site.example.com&port=443&secret=7gARIjNEVWZ3iJmqu8zd7v9wcm94eS5leGFtcGxlLmNvbQ'
          bash uninstall.sh --help | grep -F -- '--purge-certificate'
          test_dir="$(mktemp -d)"
          set +e
          output="$(sudo env CONFIG_DIR="${test_dir}/not-installed" bash install.sh \
            --domain invalid 2>&1)"
          status=$?
          set -e
          rm -rf -- "$test_dir"
          test "$status" -eq 1
          grep -F 'invalid domain: invalid' <<<"$output"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Test TLS profile selection
        run: cargo test --locked fingerprint
      - name: Test adaptive TLS record profiles
        run: cargo test --locked selected_record_profiles_have_distinct_bounded_phases
